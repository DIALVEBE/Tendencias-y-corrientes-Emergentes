<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description | escape }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="site-shell header-inner">
        <a class="brand" href="{{ '/' | relative_url }}">Tendencias y corrientes emergentes</a>
        <nav aria-label="Navegación principal">
          <a href="{{ '/arbol-problemas/' | relative_url }}">Árbol de problemas</a>
          <a href="{{ '/arbol-soluciones/' | relative_url }}">Árbol de soluciones</a>
        </nav>
      </div>
    </header>
    <main class="site-shell page-content{% if page.tree_kind == 'problem' %} full-page-content{% endif %}">
      {{ content }}
    </main>
    <footer class="site-footer{% if page.tree_kind == 'problem' %} problem-footer{% endif %}">
      <div class="site-shell">Actividad: Crisis y soluciones para la educación · Educación superior</div>
    </footer>
    <script src="{{ '/assets/tree-map.js' | relative_url }}" defer></script>
  </body>
</html>
